[project]
name = "data-pipeline-env"
version = "0.1.0"
description = "Data pipeline RL environment"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "duckdb",
    "openai",
    "httpx",
    "python-dotenv",
    "pydantic",
    "numpy",
    "faker",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entrypoint = "server.app:main"