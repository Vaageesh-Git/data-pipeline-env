[project]
name = "data-pipeline-env"
version = "0.1.0"
description = "Data pipeline RL environment"
requires-python = ">=3.9"

dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "duckdb",
    "openai",
    "httpx",
    "python-dotenv",
    "pydantic",
    "numpy",
    "faker",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"


[tool.openenv]
name = "datapipe-sandbox-v1"
entrypoint = "server.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
